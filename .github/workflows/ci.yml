name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch/PR supersedes an in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # TEMPORARY DIAGNOSTIC - remove once CI is confirmed green.
  # Uses no actions and no service containers, so if this fails too, the problem
  # is that jobs are never being assigned a runner (account/repo level), not
  # anything about the workflow's content.
  runner-smoke-test:
    name: Runner smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Echo
        run: echo "A runner picked up this job."

  # Runs in parallel with `frontend` (no `needs:` between them). If either job
  # fails, the workflow as a whole fails.
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest

    services:
      postgres:
        # Matches the Postgres major used by docker-compose.yml for local dev.
        image: postgres:16-alpine
        env:
          POSTGRES_USER: trade_journal
          POSTGRES_PASSWORD: trade_journal
          POSTGRES_DB: trade_journal
        ports:
          - 5432:5432
        # Without this the test step can start before Postgres accepts connections.
        options: >-
          --health-cmd "pg_isready -U trade_journal"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql+psycopg://trade_journal:trade_journal@localhost:5432/trade_journal
      JWT_SECRET: ci-test-secret-not-used-outside-ci

    steps:
      - uses: actions/checkout@v4

      # passlib still imports the stdlib `crypt` module, which was removed in
      # Python 3.13 — so this pin is load-bearing, not incidental.
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest tests/ -v

  frontend:
    name: Frontend (lint + typecheck)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` rather than `npm install`: it installs strictly from the
      # lockfile and fails if the lockfile has drifted from package.json.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit
