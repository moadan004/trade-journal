# Render Blueprint - https://render.com/docs/blueprint-spec
#
# Declares the backend web service and its Postgres database so the setup is
# reviewable in git rather than living only in dashboard clicks. Apply it via
# Render -> Blueprints -> New Blueprint Instance, pointed at this repo.
#
# NOTE: this covers the backend only. The frontend deploys to Vercel, which is
# configured separately (see the deploy runbook in README.md). Two values must be
# set by hand after the first Vercel deploy, because the Vercel URL isn't known
# until then - both are marked `sync: false` below.

databases:
  - name: trade-journal-db
    databaseName: trade_journal
    user: trade_journal
    plan: free

services:
  - type: web
    name: trade-journal-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Migrations run in startCommand because Render's free tier rejects
    # preDeployCommand ("pre-deploy command is not supported for free tier
    # services"), which is where this belongs and where it should move if the
    # service is ever upgraded.
    #
    # Consequences of running them here instead:
    #  - They re-run on every start, including the wake-up from the free tier's
    #    idle spin-down. `alembic upgrade head` is a no-op once the DB is at head,
    #    so this costs a connection and a version check, not repeated work.
    #  - A failing migration now crash-loops the service rather than aborting the
    #    deploy and leaving the previous version serving. Check the logs on a
    #    deploy that never turns healthy.
    #  - `&&` means uvicorn never starts if the migration fails, which is the
    #    behaviour you want: better down than serving against a schema the code
    #    doesn't expect.
    #  - If this service is ever scaled past one instance, every instance runs
    #    migrations at once. Postgres DDL is transactional and Alembic takes a
    #    lock, so they serialise rather than corrupt - but single-instance is the
    #    assumption here, and the free tier enforces it anyway.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # Render exposes this as postgres://... - app.core.config normalizes the
      # scheme to postgresql+psycopg:// at load time.
      - key: DATABASE_URL
        fromDatabase:
          name: trade-journal-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Required: the auth cookie must be HTTPS-only in production.
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: lax
      # Set after the first Vercel deploy, once the frontend domain exists.
      # Same value as the frontend's authorized origin.
      - key: CORS_ORIGINS
        sync: false
      # Same Client ID as the frontend's NEXT_PUBLIC_GOOGLE_CLIENT_ID.
      - key: GOOGLE_CLIENT_ID
        sync: false
